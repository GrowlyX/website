server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    absolute_redirect off;   # behind the tunnel/gateway: never leak the 8080 listen port into Location

    # canonical host
    if ($host = www.growly.gg) { return 301 https://growly.gg$request_uri; }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml application/rss+xml application/xml text/plain;

    location = /rss { return 301 /rss.xml; }
    location ~ /opengraph-image$ { default_type image/png; try_files $uri =404; expires 1d; }
    location /_next/static/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri.html $uri/index.html =404; }

    error_page 404 /404.html;
}
