# growly.gg on the DormLab cluster (github.com/dormlab/cluster). Apply once; Keel then rolls out new `latest` images
# pushed by .github/workflows/build-image.yml, polling GHCR every 2 minutes. Public hostnames are attached to the
# cluster's Cloudflare Tunnel (growly.gg and www.growly.gg -> dormlab-gateway.envoy-gateway-system.svc.cluster.local:80).
apiVersion: v1
kind: Namespace
metadata: {name: website}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: website
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 2m"
spec:
  replicas: 2
  selector: {matchLabels: {app: website}}
  template:
    metadata: {labels: {app: website}}
    spec:
      affinity: {podAntiAffinity: {preferredDuringSchedulingIgnoredDuringExecution: [{weight: 100, podAffinityTerm: {labelSelector: {matchLabels: {app: website}}, topologyKey: kubernetes.io/hostname}}]}}
      containers:
      - name: nginx
        image: ghcr.io/growlyx/website:latest
        imagePullPolicy: Always
        ports: [{containerPort: 8080}]
        readinessProbe: {httpGet: {path: /, port: 8080}, periodSeconds: 5}
        resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: website, namespace: website}
spec:
  selector: {app: website}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: website, namespace: website}
spec:
  parentRefs: [{name: dormlab, namespace: envoy-gateway-system}]
  hostnames: ["growly.gg", "www.growly.gg"]
  rules:
  - backendRefs: [{name: website, port: 80}]
