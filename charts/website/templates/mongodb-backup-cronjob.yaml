{{- if and .Values.mongodb.enabled .Values.mongodb.backup.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.mongodb.service.name }}-backup
  labels:
    app: {{ .Values.mongodb.service.name }}-backup
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.mongodb.backup.storage.storageClass }}
  storageClassName: {{ .Values.mongodb.backup.storage.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mongodb.backup.storage.size }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.mongodb.service.name }}-backup
  labels:
    app: {{ .Values.mongodb.service.name }}-backup
spec:
  schedule: {{ .Values.mongodb.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: {{ .Values.mongodb.service.name }}-backup
        spec:
          restartPolicy: Never
          containers:
            - name: mongodump
              image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
              imagePullPolicy: {{ .Values.mongodb.image.pullPolicy }}
              env:
                - name: MONGO_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.mongodb.credentialsSecret }}
                      key: username
                - name: MONGO_PASS
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.mongodb.credentialsSecret }}
                      key: password
                - name: RETENTION_DAYS
                  value: {{ .Values.mongodb.backup.retentionDays | quote }}
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  TS="$(date -u +%Y%m%d-%H%M%S)"
                  OUT="/backup/growly-${TS}.archive.gz"
                  echo "==> mongodump -> ${OUT}"
                  mongodump \
                    --host="{{ .Values.mongodb.service.name }}" \
                    --port={{ .Values.mongodb.service.port }} \
                    --username="${MONGO_USER}" \
                    --password="${MONGO_PASS}" \
                    --authenticationDatabase=admin \
                    --archive="${OUT}" \
                    --gzip
                  echo "==> pruning backups older than ${RETENTION_DAYS} days"
                  find /backup -name 'growly-*.archive.gz' -type f -mtime "+${RETENTION_DAYS}" -print -delete
                  echo "==> current backups:"
                  ls -lh /backup
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: {{ .Values.mongodb.service.name }}-backup
{{- end }}
