replicaCount: 1

image:
  repository: internal-registry-docker-registry.registry.svc.cluster.local:5000/growly-website
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

mongodb:
  enabled: true
  image:
    repository: mongo
    tag: "7.0"
    pullPolicy: IfNotPresent
  service:
    name: growly-mongodb
    port: 27017
  database: "blog"
  credentialsSecret: "growly-mongodb-credentials"
  storage:
    size: 5Gi
    storageClass: "local-path"
  # NOTE: the memory *limit* must leave headroom for WiredTiger crash-recovery.
  # A 384Mi limit was too small: steady-state usage (~478Mi) crossed it after
  # ~a week, the first OOMKill left a dirty journal, and every subsequent
  # restart OOMed mid-recovery -> permanent CrashLoopBackOff (site down).
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  # Nightly mongodump backup CronJob (see templates/mongodb-backup-cronjob.yaml).
  backup:
    enabled: true
    schedule: "0 4 * * *"   # 04:00 UTC daily
    retentionDays: 7
    storage:
      size: 5Gi
      storageClass: "local-path"
